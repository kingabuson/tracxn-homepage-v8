<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Tracxn AI Filter turning a query into structured filters">
  <defs>
    <linearGradient id="a3bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f8fe"/>
    </linearGradient>
    <linearGradient id="a3ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b8bff"/>
      <stop offset="1" stop-color="#1a73e8"/>
    </linearGradient>
    <filter id="a3sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0a2540" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="320" height="320" fill="url(#a3bg)"/>

  <!-- header -->
  <g transform="translate(26,26)">
    <text x="0" y="14" fill="#0a2540" font-family="'Roboto',system-ui,sans-serif" font-size="14" font-weight="600">AI Filter</text>
    <text x="0" y="30" fill="#8a94a6" font-family="'Roboto',system-ui,sans-serif" font-size="10.5">Plain English → structured filters</text>
  </g>

  <!-- search / prompt bar -->
  <g transform="translate(26,66)" filter="url(#a3sh)">
    <rect width="268" height="40" rx="12" fill="#ffffff" stroke="#eaeef4"/>
    <g transform="translate(16,14)" stroke="#9aa4b2" stroke-width="1.6" fill="none" stroke-linecap="round">
      <circle cx="5" cy="5" r="4.5"/>
      <line x1="8.5" y1="8.5" x2="12" y2="12"/>
    </g>
    <text x="40" y="25" fill="#3c4858" font-family="'Roboto',system-ui,sans-serif" font-size="10.5">Military tech · India · EBITDA &gt; $1M</text>
    <g transform="translate(224,10)">
      <rect width="34" height="20" rx="10" fill="url(#a3ai)"/>
      <path d="M9 7 l1.4 3 3 1.4 -3 1.4 -1.4 3 -1.4 -3 -3 -1.4 3 -1.4 z" fill="#fff" transform="translate(1,-0.5) scale(0.7)"/>
      <text x="22" y="14" fill="#fff" font-family="'Roboto',system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">AI</text>
    </g>
  </g>

  <!-- flow arrow -->
  <g transform="translate(160,116)">
    <line x1="0" y1="0" x2="0" y2="14" stroke="#c3d4ec" stroke-width="1.6"/>
    <polyline points="-4,10 0,15 4,10" fill="none" stroke="#c3d4ec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- resulting filter chips panel -->
  <g transform="translate(26,140)" filter="url(#a3sh)">
    <rect width="268" height="152" rx="16" fill="#ffffff" stroke="#eaeef4"/>
    <text x="16" y="26" fill="#5f6b7c" font-family="'Roboto',system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="0.04em">FILTERS APPLIED</text>

    <!-- chip: Sector -->
    <g transform="translate(16,38)">
      <rect width="150" height="26" rx="8" fill="#eef4fd" stroke="#d8e6fb"/>
      <text x="12" y="17" fill="#5f6b7c" font-family="'Roboto',system-ui,sans-serif" font-size="10.5">Sector:</text>
      <text x="55" y="17" fill="#0a2540" font-family="'Roboto',system-ui,sans-serif" font-size="10.5" font-weight="600">Military Tech</text>
    </g>
    <!-- chip: Country -->
    <g transform="translate(178,38)">
      <rect width="74" height="26" rx="8" fill="#eef4fd" stroke="#d8e6fb"/>
      <circle cx="16" cy="13" r="4" fill="#1a73e8" opacity="0.5"/>
      <text x="27" y="17" fill="#0a2540" font-family="'Roboto',system-ui,sans-serif" font-size="10.5" font-weight="600">India</text>
    </g>
    <!-- chip: EBITDA -->
    <g transform="translate(16,74)">
      <rect width="130" height="26" rx="8" fill="#eef4fd" stroke="#d8e6fb"/>
      <text x="12" y="17" fill="#5f6b7c" font-family="'Roboto',system-ui,sans-serif" font-size="10.5">EBITDA:</text>
      <text x="60" y="17" fill="#0a2540" font-family="'Roboto',system-ui,sans-serif" font-size="10.5" font-weight="600">&gt; $1M</text>
    </g>
    <!-- chip: Stage -->
    <g transform="translate(154,74)">
      <rect width="98" height="26" rx="8" fill="#eef4fd" stroke="#d8e6fb"/>
      <text x="12" y="17" fill="#5f6b7c" font-family="'Roboto',system-ui,sans-serif" font-size="10.5">Profitable</text>
      <circle cx="86" cy="13" r="5" fill="#e7f7ee"/>
      <polyline points="83.5,13 85.2,14.8 88.5,11.2" fill="none" stroke="#0a7d4d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <line x1="16" y1="114" x2="252" y2="114" stroke="#eef2f8"/>
    <text x="16" y="136" fill="#1a73e8" font-family="'Roboto',system-ui,sans-serif" font-size="11" font-weight="600">42 companies match</text>
    <rect x="196" y="122" width="56" height="20" rx="10" fill="url(#a3ai)"/>
    <text x="224" y="136" fill="#fff" font-family="'Roboto',system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle">View all</text>
  </g>
</svg>
