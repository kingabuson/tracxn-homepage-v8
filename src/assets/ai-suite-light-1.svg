<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Tracxn AI Assistant chat interface">
  <defs>
    <linearGradient id="a1bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f8fe"/>
    </linearGradient>
    <linearGradient id="a1send" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b8bff"/>
      <stop offset="1" stop-color="#1a73e8"/>
    </linearGradient>
    <filter id="a1sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0a2540" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="320" height="320" fill="url(#a1bg)"/>

  <!-- header -->
  <g transform="translate(26,26)">
    <rect width="30" height="30" rx="9" fill="#e8f1fe"/>
    <g transform="translate(7.5,6.5)" fill="none" stroke="#1a73e8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.5 1 C6 1 4.7 1.9 4.3 3.1 C3 3.2 1.9 4.3 1.9 5.7 C1.9 6.4 2.2 7.1 2.7 7.6 C2.1 8.1 1.9 8.8 2 9.6 C2.2 10.7 3.2 11.4 4.3 11.4 C4.6 12.4 5.6 13 6.6 13 C7 13 7.5 12.9 7.5 12.9 Z"/>
      <path d="M7.5 1 C9 1 10.3 1.9 10.7 3.1 C12 3.2 13.1 4.3 13.1 5.7 C13.1 6.4 12.8 7.1 12.3 7.6 C12.9 8.1 13.1 8.8 13 9.6 C12.8 10.7 11.8 11.4 10.7 11.4 C10.4 12.4 9.4 13 8.4 13 C8 13 7.5 12.9 7.5 12.9 Z"/>
      <line x1="7.5" y1="1" x2="7.5" y2="12.9"/>
    </g>
    <text x="42" y="15" fill="#0a2540" font-family="'Roboto',system-ui,sans-serif" font-size="14" font-weight="600">AI Assistant</text>
    <text x="42" y="30" fill="#8a94a6" font-family="'Roboto',system-ui,sans-serif" font-size="10.5">Ask. Analyze. Discover.</text>
  </g>

  <line x1="26" y1="72" x2="294" y2="72" stroke="#e8edf5" stroke-width="1"/>

  <!-- user query bubble -->
  <g transform="translate(96,90)" filter="url(#a1sh)">
    <rect width="198" height="42" rx="14" fill="url(#a1send)"/>
    <text x="16" y="19" fill="#ffffff" font-family="'Roboto',system-ui,sans-serif" font-size="11.5" font-weight="500">Profitable fintech startups in</text>
    <text x="16" y="33" fill="#ffffff" font-family="'Roboto',system-ui,sans-serif" font-size="11.5" font-weight="500">India, Series B+</text>
  </g>

  <!-- assistant response card -->
  <g transform="translate(26,148)" filter="url(#a1sh)">
    <rect width="230" height="118" rx="16" fill="#ffffff" stroke="#eaeef4" stroke-width="1"/>
    <text x="16" y="24" fill="#5f6b7c" font-family="'Roboto',system-ui,sans-serif" font-size="10">128 matches · ranked by Tracxn Score</text>

    <!-- row 1 -->
    <g transform="translate(16,36)">
      <circle cx="11" cy="11" r="11" fill="#eef3fb"/>
      <text x="11" y="15" fill="#1a73e8" font-family="'Roboto',system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">R</text>
      <text x="30" y="10" fill="#0a2540" font-family="'Roboto',system-ui,sans-serif" font-size="11.5" font-weight="600">Razorpay</text>
      <text x="30" y="22" fill="#8a94a6" font-family="'Roboto',system-ui,sans-serif" font-size="9.5">Payments · $7.5B</text>
      <rect x="150" y="2" width="48" height="18" rx="9" fill="#e7f7ee"/>
      <text x="174" y="14" fill="#0a7d4d" font-family="'Roboto',system-ui,sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Score 96</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(16,74)">
      <circle cx="11" cy="11" r="11" fill="#eef3fb"/>
      <text x="11" y="15" fill="#1a73e8" font-family="'Roboto',system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">G</text>
      <text x="30" y="10" fill="#0a2540" font-family="'Roboto',system-ui,sans-serif" font-size="11.5" font-weight="600">Groww</text>
      <text x="30" y="22" fill="#8a94a6" font-family="'Roboto',system-ui,sans-serif" font-size="9.5">Investing · $3.0B</text>
      <rect x="150" y="2" width="48" height="18" rx="9" fill="#e7f7ee"/>
      <text x="174" y="14" fill="#0a7d4d" font-family="'Roboto',system-ui,sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Score 94</text>
    </g>
  </g>

  <!-- input bar -->
  <g transform="translate(26,282)">
    <rect width="268" height="24" rx="12" fill="#ffffff" stroke="#e3e9f2" stroke-width="1"/>
    <text x="14" y="16" fill="#9aa4b2" font-family="'Roboto',system-ui,sans-serif" font-size="10.5">Ask a follow-up…</text>
    <circle cx="254" cy="12" r="9" fill="url(#a1send)"/>
    <g transform="translate(254,12)" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="0" y1="3.2" x2="0" y2="-3.2"/>
      <polyline points="-2.8,-0.6 0,-3.4 2.8,-0.6"/>
    </g>
  </g>
</svg>
