<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Storm</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { height: 100%; }
  #scene { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.143.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.143.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>

<script type="module">
import * as THREE from 'three'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js'
import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js'
import { CopyShader } from 'three/addons/shaders/CopyShader.js'

function hexToVec3(hex) {
  const n = parseInt(hex.slice(1), 16)
  return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255)
}

const CONFIG = {
  bgColor: '#040b1f',
  flameColor: '#2d8bff',
  flameColor2: '#bfe6ff',
  flameAmt: 0.0,        // v5g: transparent canvas -> no plasma haze, clean compositing
  atmoColor: '#7ac8ff',
  atmoCount: 300,
  atmoSize: 24,
  atmoSpeed: 1.0,
  coreColor: '#0a2a6a',
  midColor: '#2d8bff',
  rimColor: '#bfe6ff',
  opacity: 2,
  pointSize: 80,
  brightness: 1.6,
  spin: 0.03,
  blowUp: 0,
  repelRadius: 1.4,
  repelStrength: 4,
  scrollDive: 3,
  scrollGrow: 0.5,
  scrollSpin: 0.6,
  parallax: 0.7,
}

/* ---------- Light / dark theme ----------
   v5g merges v5d (light/dark hero toggle) with v5f (face-on-hover orb). The
   host page (HeroEditorial) posts a `storm-theme` message whenever the hero is
   toggled. The IDLE storm orb is the same transparent blue in both modes, but
   the FACE is rendered two different ways (selected by `invert` -> uInvert):

   - DARK hero: a GLOW portrait from face.png — particles dense where the source
     is BRIGHT (lit skin), shaded navy -> blue -> white-blue. Glows over navy.
   - LIGHT hero: an INK portrait from face_light.png — particles dense where the
     source is DARK (brows, eyes, nose, lips), so the features are the densest
     part instead of holes. The drive value is ink strength (1 - luminance), so
     the palette runs the OTHER way: faint light-blue on lit skin (low strength)
     -> deep navy on the shaded features (high strength). Navy stays dark when
     additively stacked, so dense features read solid on white. */
const FACE_COLORS = {
  dark:  { shadow: '#0a2a6a', mid: '#2d8bff', hi: '#e9f3ff', gain: 1.0,  invert: 0 },
  light: { shadow: '#7aa8ee', mid: '#3273e4', hi: '#0a1f44', gain: 1.0,  invert: 1 },
}
const THEME = { dark: false }
let invertTarget = 0   // 0 = glow (dark), 1 = ink (light); lerped to in render

const LAYERS = { NONE: 0, TORUS_SCENE: 1, BLOOM_SCENE: 2, ENTIRE_SCENE: 3 }

const canvas = document.getElementById('scene')
// v5g: transparent canvas so the orb composites over the host's hero panel
// (light blue gradient OR dark navy) instead of carrying its own background.
const renderer = new THREE.WebGL1Renderer({ canvas, antialias: true, alpha: true, premultipliedAlpha: false })
// Cap the pixel ratio: this additive 100k-point cloud is fill-rate bound, and
// raw devicePixelRatio (2–3 on retina/mobile) multiplies every fragment.
const PR = Math.min(window.devicePixelRatio || 1, 2)
renderer.setPixelRatio(PR)
renderer.setSize(innerWidth, innerHeight)
renderer.setClearColor(0x000000, 0)
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.VSMShadowMap

const scene = new THREE.Scene()
scene.background = null
scene.fog = new THREE.Fog(0x000000, 0, 15)

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 80)
camera.position.set(0, 0, 7)
camera.layers.enable(LAYERS.TORUS_SCENE)
camera.layers.enable(LAYERS.BLOOM_SCENE)
camera.layers.enable(LAYERS.ENTIRE_SCENE)
scene.add(camera)

/* ---------- Storm point cloud ---------- */
// Dense on desktop for a crisp face; lighter on small/mobile screens (where the
// orb footprint is small anyway) to keep this fill-rate-bound cloud smooth.
const count = (Math.min(innerWidth, innerHeight) < 760 ? 70000 : 120000), radius = 2.5
const positions = new Float32Array(count * 3)
const scales = new Float32Array(count)
const noises = new Float32Array(count)
const radialPush = new Float32Array(count)
const mixv = new Float32Array(count)
for (let i = 0; i < count; i++) {
  const i3 = i * 3
  let u, v, s
  do { u = Math.random() * 2 - 1; v = Math.random() * 2 - 1; s = u * u + v * v } while (s >= 1 || s === 0)
  const factor = 2 * Math.sqrt(1 - s)
  const dx = u * factor, dy = v * factor, dz = 1 - 2 * s
  const rN = Math.pow(Math.random(), 0.4)
  const r = radius * (0.55 + rN * 0.45)
  positions[i3] = dx * r; positions[i3 + 1] = dy * r; positions[i3 + 2] = dz * r
  mixv[i] = rN
  scales[i] = 0.45 + Math.random() * 0.8
  noises[i] = Math.random()
  radialPush[i] = 0.4 + rN * 1.1
}

/* ---------- Face portrait morph targets ----------
   On hover the storm reorganizes into a *shaded* robotic-AI face portrait. A
   grayscale face image (public/face.png) is sampled as a brightness map:
   particles are placed densely where the face is bright (skin, highlights)
   and sparsely where it is dark (eye sockets, hair, background), and each
   particle carries the local luminance so the cloud renders the face's
   light and shadow — not just an outline. The image loads asynchronously;
   until it arrives every particle's target is its own storm position (so the
   morph is a no-op), then the attributes are filled in and re-uploaded. */
// Two independent face target sets: `aFace`/`aFaceLum` (glow, from face.png) and
// `aFaceInk`/`aFaceInkLum` (ink, from face_light.png). uInvert picks between them
// per theme. Both start as each particle's own storm position (morph = no-op)
// until their image decodes and fills them in.
const faceTargets = new Float32Array(count * 3)
const faceLum = new Float32Array(count)
const faceInkTargets = new Float32Array(count * 3)
const faceInkLum = new Float32Array(count)
for (let i = 0; i < count; i++) {           // placeholder until the images load
  faceTargets[i * 3] = faceInkTargets[i * 3] = positions[i * 3]
  faceTargets[i * 3 + 1] = faceInkTargets[i * 3 + 1] = positions[i * 3 + 1]
  faceTargets[i * 3 + 2] = faceInkTargets[i * 3 + 2] = positions[i * 3 + 2]
  faceLum[i] = 1.0
  faceInkLum[i] = 1.0
}

const geometry = new THREE.BufferGeometry()
geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3))
geometry.setAttribute('aScale', new THREE.Float32BufferAttribute(scales, 1))
geometry.setAttribute('aNoise', new THREE.Float32BufferAttribute(noises, 1))
geometry.setAttribute('aRadialPush', new THREE.Float32BufferAttribute(radialPush, 1))
geometry.setAttribute('aMix', new THREE.Float32BufferAttribute(mixv, 1))
geometry.setAttribute('aFace', new THREE.Float32BufferAttribute(faceTargets, 3))
geometry.setAttribute('aFaceLum', new THREE.Float32BufferAttribute(faceLum, 1))
geometry.setAttribute('aFaceInk', new THREE.Float32BufferAttribute(faceInkTargets, 3))
geometry.setAttribute('aFaceInkLum', new THREE.Float32BufferAttribute(faceInkLum, 1))

const FACE = {
  faceH: 5.0,           // world height of the portrait
  offX: 0.0, offY: 0.0, // centered on the orb origin
  glowLo: 0.05, glowHi: 0.62,   // luminance accept window (bright -> dense skin)
  inkLo: 0.12,  inkHi: 0.72,    // ink-strength accept window (dark -> dense features)
}

// Build a face target set from an image's tonal map. `invert=false` samples
// dense where the image is BRIGHT (glow); `invert=true` samples dense where it
// is DARK (ink). The drive value V stored per particle is luminance (glow) or
// ink strength = 1 - luminance (ink) — high V always means "more present here".
function loadFaceMap(src, faceAttr, lumAttr, invert, lo, hi, label) {
  const img = new Image()
  img.onerror = () => { console.warn('Storm: ' + src + ' failed to load; ' + label + ' face disabled.') }
  img.onload = () => {
   try {
    const iw = img.naturalWidth, ih = img.naturalHeight
    if (!iw || !ih) { console.warn('Storm: ' + src + ' decoded empty.'); return }
    const cv = document.createElement('canvas')
    cv.width = iw; cv.height = ih
    const ctx = cv.getContext('2d', { willReadFrequently: true })
    ctx.drawImage(img, 0, 0)
    const data = ctx.getImageData(0, 0, iw, ih).data
    const valAt = (px, py) => {
      px = px < 0 ? 0 : px >= iw ? iw - 1 : px
      py = py < 0 ? 0 : py >= ih ? ih - 1 : py
      const k = (py * iw + px) * 4
      const L = (0.299 * data[k] + 0.587 * data[k + 1] + 0.114 * data[k + 2]) / 255
      return invert ? 1.0 - L : L
    }
    const faceW = FACE.faceH * (iw / ih)
    const fa = faceAttr.array, fl = lumAttr.array
    for (let i = 0; i < count; i++) {
      const i3 = i * 3
      // Rejection-sample weighted by the drive value: high V -> many particles.
      let u = 0, v = 0, V = 0, ok = false
      for (let tries = 0; tries < 24; tries++) {
        u = Math.random(); v = Math.random()
        V = valAt((u * iw) | 0, (v * ih) | 0)
        const accept = (V - lo) / (hi - lo)        // 0 at lo, 1 at hi
        if (Math.random() < accept) { ok = true; break }
      }
      if (!ok) continue // couldn't land on the face -> stays as storm haze
      const jx = (Math.random() - 0.5) / iw, jy = (Math.random() - 0.5) / ih
      fa[i3]     = ((u + jx) - 0.5) * faceW + FACE.offX
      fa[i3 + 1] = (0.5 - (v + jy)) * FACE.faceH + FACE.offY
      fa[i3 + 2] = (V - 0.45) * 0.6              // subtle relief: dense areas forward
      fl[i] = V
    }
    faceAttr.needsUpdate = true
    lumAttr.needsUpdate = true
   } catch (err) { console.warn('Storm: ' + label + ' face sampling failed', err) }
  }
  img.src = src
}

// Glow face (dark hero): dense at bright skin. Ink face (light hero): dense at
// dark features. If face_light.png is missing the orb just stays a plain storm
// on the light hero (graceful fallback).
loadFaceMap('face.png',       geometry.attributes.aFace,    geometry.attributes.aFaceLum,    false, FACE.glowLo, FACE.glowHi, 'glow')
loadFaceMap('face_light.png', geometry.attributes.aFaceInk, geometry.attributes.aFaceInkLum, true,  FACE.inkLo,  FACE.inkHi,  'ink')

const uniforms = {
  uTime:          { value: 0 },
  uSize:          { value: CONFIG.pointSize },
  uOpacity:       { value: 0 },
  uBlowUp:        { value: CONFIG.blowUp },
  uCursor:        { value: new THREE.Vector3() },
  uRepelRadius:   { value: CONFIG.repelRadius },
  uRepelStrength: { value: CONFIG.repelStrength },
  uActivity:      { value: 0 },
  uMorph:         { value: 0 },
  uInvert:        { value: 0 },   // 0 = glow face (dark), 1 = ink face (light)
  uCore:          { value: hexToVec3(CONFIG.coreColor) },
  uMid:           { value: hexToVec3(CONFIG.midColor) },
  uRim:           { value: hexToVec3(CONFIG.rimColor) },
  uBrightness:    { value: CONFIG.brightness },
  // Face palette (theme-specific; set by applyTheme()).
  uFaceShadow:    { value: hexToVec3(FACE_COLORS.light.shadow) },
  uFaceMid:       { value: hexToVec3(FACE_COLORS.light.mid) },
  uFaceHi:        { value: hexToVec3(FACE_COLORS.light.hi) },
  uFaceGain:      { value: FACE_COLORS.light.gain },
}

const stormMaterial = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms,
  vertexShader: `
uniform float uTime; uniform float uSize; uniform float uBlowUp;
uniform vec3 uCursor; uniform float uRepelRadius; uniform float uRepelStrength; uniform float uActivity;
uniform vec3 uCore; uniform vec3 uMid; uniform vec3 uRim; uniform float uMorph; uniform float uInvert;
uniform vec3 uFaceShadow; uniform vec3 uFaceMid; uniform vec3 uFaceHi;
attribute float aScale; attribute float aNoise; attribute float aRadialPush; attribute float aMix;
attribute vec3 aFace; attribute float aFaceLum;
attribute vec3 aFaceInk; attribute float aFaceInkLum;
varying vec3 vColor; varying float vBlowUp; varying float vFaceLum; varying float vMorph;
void main() {
  // Pick the glow (dark) or ink (light) face target & drive value for this theme.
  vec3 aFaceT = mix(aFace, aFaceInk, uInvert);
  float aFaceV = mix(aFaceLum, aFaceInkLum, uInvert);
  // ----- Per-particle organizing progress -----
  // Each particle starts assembling at a staggered time (from aNoise) and over
  // its own little window, so the face builds as a flowing wave of points
  // rather than snapping. e = eased 0..1 travel for THIS particle.
  float SPREAD = 0.5;                                  // how staggered the wave is
  float m = clamp((uMorph - aNoise * SPREAD) / (1.0 - SPREAD), 0.0, 1.0);
  float e = 1.0 - pow(1.0 - m, 3.0);                   // ease-out-cubic arrival

  // Turbulent storm shape — its motion fades out as this particle assembles.
  float calm = 1.0 - e;
  vec3 pos = position;

  float t = uTime * 1.4 + aNoise * 6.2831;
  float wobble = sin(t) * 0.1 * aRadialPush * calm;
  pos *= 1.0 + wobble;

  float swirlAngle = (uTime * 0.05 + aNoise * 6.2831) * calm;
  mat2 swirl = mat2(cos(swirlAngle), -sin(swirlAngle), sin(swirlAngle), cos(swirlAngle));
  pos.xz = swirl * pos.xz;

  vec3 outward = normalize(pos + vec3(0.0001));
  float blow = uBlowUp * uBlowUp;
  pos += outward * blow * (10.0 + aNoise * 18.0) * aRadialPush * calm;

  // Travel from the storm position to the face target along a CURVED path:
  // a tangential "curl" offset peaks mid-flight and vanishes at both ends, so
  // particles swirl into place instead of sliding in straight lines.
  vec3 stormP = pos;
  vec3 toFace = aFaceT - stormP;
  vec3 tang = normalize(cross(toFace + vec3(0.0001), vec3(0.0, 0.0, 1.0)) + vec3(0.00012));
  float arc = sin(e * 3.14159265);                     // 0 at ends, 1 at midpoint
  vec3 curl = tang * arc * (0.45 + aNoise * 0.9);
  // a little inward/outward breathing on the curl for organic flow
  curl += outward * arc * (aNoise - 0.5) * 0.8;
  pos = mix(stormP, aFaceT, e) + curl;

  vec4 modelPosition = modelMatrix * vec4(pos, 1.0);

  // Cursor repel is suppressed while the face is held so it stays crisp.
  vec3 toParticle = modelPosition.xyz - uCursor;
  float dist = length(toParticle);
  float falloff = smoothstep(uRepelRadius, 0.0, dist);
  modelPosition.xyz += normalize(toParticle + vec3(0.0001)) * falloff * uRepelStrength * uActivity * calm;

  vec4 viewPosition = viewMatrix * modelPosition;
  gl_Position = projectionMatrix * viewPosition;
  // On the face, points shrink to a fine grain (smaller, denser) with a touch
  // more size on highlights -> the cloud reads as smooth shading, not blobs.
  float faceSize = (0.48 + 0.42 * aFaceV);
  gl_PointSize = uSize * aScale * mix(1.0, faceSize, e);
  gl_PointSize *= (1.0 / -viewPosition.z);

  float t1 = smoothstep(0.25, 0.85, aMix);
  vec3 mix1 = mix(uCore, uMid, t1);
  float t2 = clamp((aMix - 0.7) * 3.0, 0.0, 1.0);
  vColor = mix(mix1, uRim, t2);
  // As each particle arrives, drive its color by the drive value using the
  // theme-specific palette: low V -> shadow, mid, high V -> hi. (Glow: high V is
  // lit skin -> white-blue. Ink: high V is a dark feature -> deep navy.)
  vec3 faceCol = mix(uFaceShadow, uFaceMid, smoothstep(0.06, 0.42, aFaceV));
  faceCol = mix(faceCol, uFaceHi, smoothstep(0.74, 1.0, aFaceV));
  vColor = mix(vColor, faceCol, e);
  vFaceLum = aFaceV;
  vMorph = e;
  vBlowUp = uBlowUp;
}
  `,
  fragmentShader: `
uniform float uOpacity; uniform float uBrightness; uniform float uFaceGain; uniform float uInvert;
varying vec3 vColor; varying float vBlowUp; varying float vFaceLum; varying float vMorph;
void main() {
  vec2 uv = gl_PointCoord - 0.5;
  float d = length(uv);
  if (d > 0.5) discard;
  float strength = pow(1.0 - d * 2.0, 4.5);
  // Glow uses the per-particle palette color. Ink uses a neutral bright blue so
  // the render target encodes DENSITY (overlap), which the FinalPass then remaps
  // to an ink tone — dense -> deep navy, sparse -> light. (Colouring ink dark
  // here would fight additive blending and make the densest features glow.)
  vec3 baseCol = mix(vColor, vec3(0.58, 0.74, 1.0), uInvert);
  vec3 color = mix(vec3(0.0), baseCol, strength);
  // GLOW (dark hero): brightness rises with the drive value so lit skin glows
  // and white-blue highlights pop on navy. uFaceGain scales the whole face.
  float glowBright = (0.36 + vFaceLum * vFaceLum * 0.9) * uFaceGain;
  float glowAlpha  = 0.26 + vFaceLum * 0.95;
  // INK (light hero): ~flat moderate per-particle level, so it is DENSITY (not
  // per-point luminance) that drives how dark/opaque the FinalPass makes a spot.
  float inkBright = 0.55;
  float inkAlpha  = 0.8;
  float faceBright = mix(1.0, mix(glowBright, inkBright, uInvert), vMorph);
  float faceAlpha  = mix(1.0, mix(glowAlpha,  inkAlpha,  uInvert), vMorph);
  float blowFade = 1.0 - smoothstep(0.15, 1.0, vBlowUp);
  gl_FragColor = vec4(color * uBrightness * faceBright, strength * uOpacity * blowFade * faceAlpha);
}
  `,
})

const points = new THREE.Points(geometry, stormMaterial)
points.layers.enable(LAYERS.ENTIRE_SCENE)
const group = new THREE.Group()
group.add(points)
scene.add(group)

/* ---------- Ambient atmosphere motes ---------- */
const N = Math.round(CONFIG.atmoCount)
const aPositions = new Float32Array(N * 3), aSizes = new Float32Array(N), aSeeds = new Float32Array(N)
for (let i = 0; i < N; i++) {
  aPositions[i * 3] = 2 * Math.random() - 1
  aPositions[i * 3 + 1] = 2 * Math.random() - 1
  aPositions[i * 3 + 2] = 2 * Math.random() - 1
  aSizes[i] = CONFIG.atmoSize * (0.4 + Math.random())
  aSeeds[i] = Math.random()
}
const atmoGeo = new THREE.BufferGeometry()
atmoGeo.setAttribute('position', new THREE.Float32BufferAttribute(aPositions, 3))
atmoGeo.setAttribute('size', new THREE.Float32BufferAttribute(aSizes, 1))
atmoGeo.setAttribute('seed', new THREE.Float32BufferAttribute(aSeeds, 1))

const atmoMat = new THREE.ShaderMaterial({
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: false,
  uniforms: {
    uTime: { value: 0 },
    uColor: { value: hexToVec3(CONFIG.atmoColor) },
    uRes: { value: new THREE.Vector2(innerWidth * PR, innerHeight * PR) },
  },
  vertexShader: `
attribute float size; attribute float seed; uniform float uTime; uniform vec2 uRes;
varying float vA;
vec3 warp(vec3 p, float t){ float c=0.9,a=1.9,b=0.02,s=0.05; p*=2.;
  p.x+=c*sin(s*t+a*p.y)+t*b; p.y+=c*cos(s*t+a*p.x); p.y+=c*sin(s*t+a*p.z)+t*b;
  p.z+=c*cos(s*t+a*p.y); p.z+=c*sin(s*t+a*p.x)+t*b; p.x+=c*cos(s*t+a*p.z);
  return cos(p+vec3(1,2,4)); }
void main(){
  vec3 v = position*4.0 + warp(position, uTime)*1.2;
  vec4 mv = modelViewMatrix * vec4(v, 1.0);
  float r = length(v); float farF = 1.0 - smoothstep(5.0, 6.5, r); float nearF = smoothstep(0.0, 0.5, -mv.z);
  vA = farF * nearF;
  gl_PointSize = size * uRes.y / 900.0 / -mv.z; gl_PointSize = max(gl_PointSize, 1.0);
  gl_Position = projectionMatrix * mv;
}
  `,
  fragmentShader: `
uniform vec3 uColor; varying float vA;
void main(){ vec2 p = gl_PointCoord - 0.5; float l = length(p); if (l > 0.5) discard;
  float tex = smoothstep(0.5, 0.0, l); gl_FragColor = vec4(uColor * tex, tex * vA * 0.6); }
  `,
})

const motes = new THREE.Points(atmoGeo, atmoMat)
motes.frustumCulled = false
motes.layers.enable(LAYERS.ENTIRE_SCENE)
scene.add(motes)

/* ---------- Postprocessing ---------- */
const FinalPass = {
  uniforms: {
    iTime: { value: 0 },
    tDiffuse: { value: null }, torusTexture: { value: null }, bloomTexture: { value: null }, haloTexture: { value: null },
    uBg: { value: hexToVec3(CONFIG.bgColor) },
    uFlameA: { value: hexToVec3(CONFIG.flameColor) },
    uFlameB: { value: hexToVec3(CONFIG.flameColor2) },
    uFlameAmt: { value: CONFIG.flameAmt },
    uInvert: { value: 0 },                          // 0 = glow, 1 = ink remap
    uInkDark: { value: hexToVec3('#123a82') },      // dense ink -> deep vivid blue
    uInkLight: { value: hexToVec3('#aacefb') },     // sparse ink -> light blue
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
  fragmentShader: `
uniform float iTime; uniform sampler2D tDiffuse; uniform sampler2D bloomTexture; uniform sampler2D torusTexture; uniform sampler2D haloTexture;
uniform vec3 uBg; uniform vec3 uFlameA; uniform vec3 uFlameB; uniform float uFlameAmt;
uniform float uInvert; uniform vec3 uInkDark; uniform vec3 uInkLight;
varying vec2 vUv;
vec3 warp3d(vec3 pos, float t){ float curv=.8,a=1.9,b=0.7; pos*=2.;
  pos.x+=curv*sin(t+a*pos.y)+t*b; pos.y+=curv*cos(t+a*pos.x);
  pos.y+=curv*sin(t+a*pos.z)+t*b; pos.z+=curv*cos(t+a*pos.y);
  pos.z+=curv*sin(t+a*pos.x)+t*b; pos.x+=curv*cos(t+a*pos.z);
  return 0.5+0.5*cos(pos.xyz+vec3(1,2,4)); }
void main(){
  vec2 uv = 2.*vUv - 1.;
  vec3 w = pow(warp3d(vec3(uv.x, sin(uv.y), uv.y), iTime*1.5), vec3(1.5));
  vec3 flame = 1.5*uFlameA*w.x; flame*=w.y; flame += uFlameB*w.z;
  flame *= smoothstep(0.25, 1., abs(uv.y));
  float md = smoothstep(-0.7, 1., -uv.y*uv.x); flame *= md*md;
  vec3 halo = texture2D(haloTexture, vUv).xyz;
  // v5g transparent variant (from v5d): no opaque background. The orb is
  // composited over the host's hero panel via straight alpha; everything else
  // is transparent (lets the panel — light or dark — through).
  vec3 plasma = flame*uFlameAmt + texture2D(bloomTexture, vUv).xyz + texture2D(torusTexture, vUv).xyz + texture2D(tDiffuse, vUv).xyz + halo;
  float b = max(plasma.r, max(plasma.g, plasma.b));   // accumulated brightness ~ density
  // GLOW (dark hero): show the plasma colour, opacity keyed from its brightness
  // (bright particles -> opaque, lifts the faint outer cloud too).
  float aGlow = clamp(pow(b, 0.55) * 1.3, 0.0, 1.0);
  // INK (light hero): density (b) drives BOTH the tone (light blue where sparse
  // -> deep navy where dense) and the opacity, so the densest features read as
  // solid dark ink on the white panel instead of additively glowing blue.
  float tone = clamp(pow(b, 0.62) * 1.5, 0.0, 1.0);
  vec3 inkCol = mix(uInkLight, uInkDark, tone);
  // Lift sparse particles (low b) so the storm scatter AROUND the face shows as
  // light-blue dots on white — the equivalent of the dark hero's halo — while
  // the dense features still saturate to solid ink.
  float aInk = clamp(pow(b, 0.30) * 1.7, 0.0, 1.0);
  vec3 outCol = mix(plasma, inkCol, uInvert);
  float outA  = mix(aGlow,  aInk,   uInvert);
  gl_FragColor = vec4(outCol, outA);
}
  `,
}

const renderScene = new RenderPass(scene, camera)

const torusComposer = new EffectComposer(renderer)
torusComposer.renderToScreen = false
torusComposer.addPass(renderScene)
torusComposer.addPass(new ShaderPass(GammaCorrectionShader))
torusComposer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.22, 0.2, 0))
torusComposer.addPass(new ShaderPass(CopyShader))

const bloomComposer = new EffectComposer(renderer)
bloomComposer.renderToScreen = false
bloomComposer.addPass(renderScene)
bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.4, 0.55, 0))
bloomComposer.addPass(new ShaderPass(GammaCorrectionShader))

const finalComposer = new EffectComposer(renderer)
finalComposer.addPass(renderScene)
const finalPass = new ShaderPass(FinalPass)
finalPass.uniforms.bloomTexture.value = bloomComposer.renderTarget1.texture
finalPass.uniforms.torusTexture.value = torusComposer.renderTarget1.texture
finalComposer.addPass(finalPass)

/* ---------- Mote onBeforeRender drives iTime + follows camera ---------- */
motes.onBeforeRender = () => {
  const t = performance.now() / 1000
  atmoMat.uniforms.uTime.value = t * CONFIG.atmoSpeed * 8.0
  motes.position.copy(camera.position)
  finalPass.uniforms.iTime.value = t
}

/* ---------- Storm object render ---------- */
const appearStart = performance.now()
const sceneObj = {
  uniforms,
  group,
  appearStart,
  t0: performance.now() / 1000,
  morph: 0,
  invert: 0,
  render(scroll, m) {
    const t = performance.now() / 1000
    const dt = Math.min(0.05, t - this.t0); this.t0 = t
    this.uniforms.uTime.value = t
    camera.position.set(m.x * CONFIG.parallax, m.y * CONFIG.parallax, 7 - scroll * CONFIG.scrollDive)
    camera.lookAt(0, 0, 0)
    this.group.scale.setScalar(1 + scroll * CONFIG.scrollGrow)
    const elapsed = performance.now() - this.appearStart
    const fade = Math.max(0, Math.min(1, (elapsed - 300) / 1400))
    this.uniforms.uOpacity.value = fade * CONFIG.opacity
    this.uniforms.uBlowUp.value = 0
    this.uniforms.uCursor.value.copy(POINTER.world)
    this.uniforms.uActivity.value = POINTER.activity

    // Hover (cursor over the orb) assembles the face; leaving disperses it.
    // Eased over ~1.5–2s so you watch the particles flow into place; slightly
    // slower on the way out so the storm re-forms gently.
    const wantMorph = POINTER.active ? 1 : 0
    this.morph += (wantMorph - this.morph) * (wantMorph ? 0.045 : 0.03)
    this.uniforms.uMorph.value = this.morph

    // Ease between the glow (dark) and ink (light) face when the theme toggles.
    this.invert += (invertTarget - this.invert) * 0.1
    this.uniforms.uInvert.value = this.invert
    finalPass.uniforms.uInvert.value = this.invert

    // No group spin: the orb stays face-front so the face assembles facing the
    // camera with no rotation — just the particle organizing animation. The
    // orb's idle life comes from the internal shader swirl/wobble instead.
    this.group.rotation.set(0, 0, 0)
  },
}

/* ---------- Pointer / cursor void ---------- */
const POINTER = { ndc: new THREE.Vector2(0, 0), world: new THREE.Vector3(), activity: 0, active: false, lastMove: performance.now() }

function setNdcFromClient(clientX, clientY) {
  POINTER.ndc.x = (clientX / window.innerWidth) * 2 - 1
  POINTER.ndc.y = -((clientY / window.innerHeight) * 2 - 1)
  POINTER.active = true; POINTER.lastMove = performance.now()
}

// Standalone interaction (mouse + touch) when the page is viewed directly.
window.addEventListener('mousemove', e => setNdcFromClient(e.clientX, e.clientY), { passive: true })
window.addEventListener('mouseout', () => { POINTER.active = false }, { passive: true })
window.addEventListener('touchmove', e => { const t = e.touches[0]; if (t) setNdcFromClient(t.clientX, t.clientY) }, { passive: true })
window.addEventListener('touchstart', e => { const t = e.touches[0]; if (t) setNdcFromClient(t.clientX, t.clientY) }, { passive: true })
window.addEventListener('touchend', () => { POINTER.active = false }, { passive: true })

// Embedded interaction: the host page forwards pointer/touch position as a
// fraction (0..1) of this iframe's rect, since the iframe itself is
// pointer-events:none and never sees the events directly. It also forwards the
// hero's light/dark theme so the face palette can switch.
function applyTheme(dark) {
  THEME.dark = !!dark
  const c = THEME.dark ? FACE_COLORS.dark : FACE_COLORS.light
  uniforms.uFaceShadow.value.copy(hexToVec3(c.shadow))
  uniforms.uFaceMid.value.copy(hexToVec3(c.mid))
  uniforms.uFaceHi.value.copy(hexToVec3(c.hi))
  uniforms.uFaceGain.value = c.gain
  invertTarget = c.invert   // dark -> glow face, light -> ink face
}
applyTheme(false)

window.addEventListener('message', e => {
  const d = e.data
  if (!d) return
  if (d.type === 'storm-theme') { applyTheme(d.dark); return }
  if (d.type !== 'storm-pointer') return
  if (d.active) {
    POINTER.ndc.x = d.x * 2 - 1
    POINTER.ndc.y = -(d.y * 2 - 1)
    POINTER.active = true; POINTER.lastMove = performance.now()
  } else {
    POINTER.active = false
  }
})

const _ndc = new THREE.Vector3(), _dir = new THREE.Vector3(), _target = new THREE.Vector3()
function updatePointer() {
  _target.set(0, 0, 0)
  if (POINTER.active) {
    _ndc.set(POINTER.ndc.x, POINTER.ndc.y, 0.5).unproject(camera)
    _dir.copy(_ndc).sub(camera.position).normalize()
    const denom = _dir.z
    if (Math.abs(denom) > 1e-4) {
      const tt = -camera.position.z / denom
      if (tt > 0 && Number.isFinite(tt)) _target.copy(camera.position).addScaledVector(_dir, tt)
    }
  }
  POINTER.world.lerp(_target, 0.12)
  const idle = (performance.now() - POINTER.lastMove) / 1000
  const want = (POINTER.active && idle < 3) ? 1 : 0
  POINTER.activity += (want - POINTER.activity) * 0.06
}

/* ---------- Scroll mapping (kept; contained element stays near 0) ---------- */
const Lerp = (a, b, t) => a + (b - a) * t
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v))
let scrollTarget = 0, scrollSmooth = 0, scrollCurrent = 0
const mouseSmooth = { x: 0, y: 0 }

function updateScroll() {
  const max = document.documentElement.scrollHeight - window.innerHeight
  scrollTarget = max > 0 ? clamp(window.scrollY / max, 0, 1) : 0
}
window.addEventListener('scroll', updateScroll, { passive: true }); updateScroll()

/* ---------- Render loop ---------- */
function render() {
  requestAnimationFrame(render)
  scrollSmooth  = Lerp(scrollSmooth, scrollTarget, 0.10)
  scrollCurrent = Lerp(scrollCurrent, scrollSmooth, 0.06)
  mouseSmooth.x = Lerp(mouseSmooth.x, POINTER.ndc.x, 0.06)
  mouseSmooth.y = Lerp(mouseSmooth.y, POINTER.ndc.y, 0.06)
  updatePointer()
  sceneObj.render(scrollCurrent, mouseSmooth)
  camera.layers.set(LAYERS.TORUS_SCENE);  torusComposer.render()
  camera.layers.set(LAYERS.BLOOM_SCENE);  bloomComposer.render()
  camera.layers.set(LAYERS.ENTIRE_SCENE); finalComposer.render()
}
render()

// Tell the host we're ready so it can (re-)send the current hero theme, even if
// its first post raced ahead of this script attaching its message listener.
try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'storm-ready' }, '*') } catch (e) {}

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  renderer.setPixelRatio(PR)
  renderer.setSize(innerWidth, innerHeight)
  camera.aspect = innerWidth / innerHeight
  camera.updateProjectionMatrix()
  torusComposer.setPixelRatio(PR); torusComposer.setSize(innerWidth, innerHeight)
  bloomComposer.setPixelRatio(PR); bloomComposer.setSize(innerWidth, innerHeight)
  finalComposer.setPixelRatio(PR); finalComposer.setSize(innerWidth, innerHeight)
  atmoMat.uniforms.uRes.value.set(innerWidth * PR, innerHeight * PR)
  updateScroll()
})
</script>
</body>
</html>
